<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Personal</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            background-color: #ffffff;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: #6c5ce7;
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        p {
            color: #666;
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
        }

        .github-button {
            background-color: #6c5ce7;
            color: #ffffff;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .github-button:hover {
            background-color: #5a4fcf;
        }

        @media (max-width: 600px) {
            .container {
                padding: 1.5rem;
            }

            h1 {
                font-size: 1.75rem;
            }

            p {
                font-size: 1rem;
            }

            .github-button {
                padding: 0.5rem 1rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Gabriel Nuñez Medina</h1>
        <p>Matrícula: 2023-1871</p>
        <button class="github-button" onclick="window.location.href='https://github.com/gabnunezm/CI-Surge-GH-Actions.git'">
            Visita el repositorio
        </button>
    </div>
</body>
</html>
